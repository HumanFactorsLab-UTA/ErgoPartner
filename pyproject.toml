[project]
name = "ergopartner"
version = "5.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "regression: pipeline baseline checks over real study footage; skipped when the footage is absent",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv*", ".gitlab-repo", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = "(?x)(^\\.venv[^/]*/|^\\.gitlab-repo/|^tests/|^analysis/|^dashboard/|^generate_abstract_figure\\.py$)"

# Neither ships type information, and the stub packages are not project dependencies.
# Ignoring the missing stubs keeps validation/ type-checked rather than excluded.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "openpyxl", "openpyxl.*", "PIL", "PIL.*"]
ignore_missing_imports = true
